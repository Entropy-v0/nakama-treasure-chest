server.port=8080

# 2. CONEXIÓN A LA BASE DE DATOS (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:libreriadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# 4. INTERFAZ WEB DE LA BASE DE DATOS
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 5. RUTAS 
app.storage.base-path=./storage
app.storage.pdfs-folder=${app.storage.base-path}/pdfs
app.storage.portadas-folder=${app.storage.base-path}/portadas

app.cors.allowed-origins=http://localhost:5173